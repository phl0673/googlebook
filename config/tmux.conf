# Activer la souris (clic pour changer de volet, glisser pour redimensionner la barre)
set -g mouse on

# Couleurs propres pour Vim
set -g default-terminal "screen-256color"

# Ouvrir les nouveaux volets dans le dossier courant
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

set -g history-limit 10000
